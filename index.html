<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preconnect to content CDNs -->
    <link rel="preconnect" href="https://cdn.sanity.io" crossorigin />
    <link rel="preconnect" href="https://ik.imagekit.io" crossorigin />

    <!-- Preload critical fonts (hero text) -->
    <link
      rel="preload"
      href="/fonts/satoshi/Satoshi-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/satoshi/Satoshi-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/instrument-serif/InstrumentSerif-Italic.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Primary Meta Tags -->
    <title>Joshua Udom — Visual Designer</title>
    <meta
      name="title"
      content="Joshua Udom — Visual Designer"
    />
    <meta
      name="description"
      content="Partnering with brands to create strategic designs that work. Specializing in flyer design, branding, social media graphics, and church media — bringing ideas to life with CorelDraw, Photoshop, Illustrator, and Figma."
    />
    <meta name="author" content="Joshua Udom" />
    <meta
      name="keywords"
      content="Joshua Udom, graphic designer, brand strategist, flyer design, branding, social media design, church design, CorelDraw, Photoshop, Illustrator, Figma, Nigeria"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0095c7" />
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://joshuaudom.vercel.app/" />
    <meta
      property="og:title"
      content="Joshua Udom — Visual Designer"
    />
    <meta
      property="og:description"
      content="Partnering with brands to create strategic designs that work. Specializing in flyer design, branding, social media graphics, and church media."
    />
    <meta
      property="og:image"
      content="https://ik.imagekit.io/idighekere/Photoroom-20240414_134760.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://joshuaudom.vercel.app/" />
    <meta
      name="twitter:title"
      content="Joshua Udom — Visual Designer"
    />
    <meta
      name="twitter:description"
      content="Partnering with brands to create strategic designs that work. Specializing in flyer design, branding, social media graphics, and church media."
    />
    <meta
      name="twitter:image"
      content="https://ik.imagekit.io/idighekere/Photoroom-20240414_134760.png"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://joshuaudom.vercel.app/" />
